# Pont ROS 2 <-> Gazebo (ros_gz_bridge). Tous les topics sont visibles directement dans RViz.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /scan
  gz_topic_name: /scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /imu
  gz_topic_name: /imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
# angles des 4 roues -> robot_state_publisher -> TF des roues
- ros_topic_name: /joint_states
  gz_topic_name: /robot_omni/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
# pose exacte du robot (vérité terrain), en message et en TF map -> base_link
- ros_topic_name: /robot_omni/pose_vraie
  gz_topic_name: /robot_omni/pose_vraie
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /tf
  gz_topic_name: /robot_omni/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: /robot_omni/roue_1/cmd_vel
  gz_topic_name: /robot_omni/roue_1/cmd_vel
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /robot_omni/roue_2/cmd_vel
  gz_topic_name: /robot_omni/roue_2/cmd_vel
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /robot_omni/roue_3/cmd_vel
  gz_topic_name: /robot_omni/roue_3/cmd_vel
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /robot_omni/roue_4/cmd_vel
  gz_topic_name: /robot_omni/roue_4/cmd_vel
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
